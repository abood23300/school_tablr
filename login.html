<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تسجيل الدخول — منشئ جدول الدروس</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .auth-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 16px; }
      .auth-card { width: 100%; max-width: 380px; }
      .auth-form { display:flex; flex-direction:column; gap:12px; }
      .auth-msg { border-radius:8px; padding:10px 12px; font-size:14px; display:none; }
      .auth-msg.show { display:block; }
      .auth-msg.error { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; }
      .auth-msg.success { background:#f0fdf4; color:#166534; border:1px solid #bbf7d0; }
      .auth-title { text-align:center; margin-bottom: 4px; }
      .auth-sub { text-align:center; color:#6b7280; margin-top:0; margin-bottom:16px; font-size:14px; }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="card auth-card">
        <h2 class="auth-title">🎓 منشئ جدول الدروس</h2>
        <p class="auth-sub">سجّل الدخول ببيانات الحساب الذي أُنشئ لمدرستك</p>

        <div id="authMsg" class="auth-msg"></div>

        <form id="loginForm" class="auth-form">
          <div class="form-row">
            <label for="loginEmail">البريد الإلكتروني</label>
            <input type="email" id="loginEmail" required autocomplete="email" />
          </div>
          <div class="form-row">
            <label for="loginPassword">كلمة المرور</label>
            <input type="password" id="loginPassword" required autocomplete="current-password" minlength="6" />
          </div>
          <button type="submit" id="loginSubmitBtn" class="primary">دخول</button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="./js/supabase-client.js"></script>
    <script src="./js/auth.js"></script>
  </body>
</html>
